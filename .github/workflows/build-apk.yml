name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional version label (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'android/**/*gradle*'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build Capacitor APK web bundle
        env:
          VITE_ANILIST_API_URL: https://graphql.anilist.co
          VITE_ANILIST_OAUTH_URL: https://anilist.co/api/v2/oauth/authorize
          VITE_ANILIST_CLIENT_ID: ${{ secrets.VITE_ANILIST_CLIENT_ID_APK || '56896' }}
          VITE_OAUTH_REDIRECT_URI: aiznima://auth/callback
          VITE_APP_PLATFORM: apk
        run: pnpm build:apk

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare release version & optional signing keystore
        id: version
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
          else
            RAW_TAG="${{ github.event.inputs.version_name || '0.1.0' }}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "AIZNIMA_VERSION_NAME=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "AIZNIMA_VERSION_CODE=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_ENV"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from GitHub Secrets."
          else
            echo "ANDROID_KEYSTORE_BASE64 not configured; falling back to debug signing."
          fi

      - name: Build Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package & verify APK artifact
        shell: bash
        run: |
          mkdir -p release-output
          APK_SOURCE=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No release APK generated!" >&2
            exit 1
          fi
          OUT_FILE="release-output/aiznima-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_SOURCE" "$OUT_FILE"
          ls -lh "$OUT_FILE"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiznima-v${{ steps.version.outputs.version_name }}-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
